# Faz merge automático das branches claude/* na main (o Vercel publica a partir da main)
name: Auto-merge claude -> main

on:
  push:
    branches:
      - "claude/**"

permissions:
  contents: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge na main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${GITHUB_REF_NAME}"
          git merge --no-edit "origin/${GITHUB_REF_NAME}" -m "Merge automático de ${GITHUB_REF_NAME} na main"
          git push origin main
